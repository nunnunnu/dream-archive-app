# 자동 수집 + 사이트 배포
#  - 매시 정각: 전체 실행 (기사·유튜브 출연 탐색·빈칸 채우기 포함)
#  - 15·30·45분: 빠른 실행 (위버스 공지·제보·등록 채널 영상만)
#  - 수집 데이터는 Supabase(사이트용 공개 버킷)·KV(질문 자료)로 올려서 배포 없이 반영
#  - 코드를 main에 올리면: 수집 없이 사이트만 다시 배포
# 수집 데이터(원문 포함)는 레포가 아니라 Supabase Storage 비공개 버킷에 둔다 (npm run sync).
# 같은 작업이 겹치면 덮어쓰기가 생기므로 앞 실행이 끝날 때까지 기다린다.
name: collect

on:
  # 실행 시각은 Cloudflare 예약 작업(cron/)이 정한다: 매시 정각 full, 15·30·45분 fast, 3시간마다 backfill (workflow_dispatch)
  # GitHub 자체 예약은 제때 안 돌아서(몇 시간씩 빠짐) 6시간마다 전체 수집 한 번만 예비로
  schedule:
    - cron: '7 */6 * * *'
  push:
    branches: [main]
    paths: ['site/**', 'collector/lib/ask-core.ts']
  workflow_dispatch:
    inputs:
      mode:
        description: 'full, fast, site(배포만), backfill(과거 기사 채우기)'
        default: full

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 실행 종류: Cloudflare 예약 작업이 보낸 mode, 없으면 GitHub 예약 시각으로 (15·30·45분 fast, 3시간 50분 backfill, 그 밖 full)
  MODE: ${{ inputs.mode || (github.event.schedule == '15,30,45 * * * *' && 'fast') || (github.event.schedule == '50 */3 * * *' && 'backfill') || (github.event_name == 'push' && 'site') || 'full' }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # 수집 상태를 Actions 캐시에 둘 때 쓰는 암호화 키 (공개 레포 캐시는 남이 꺼내 볼 수 있어서 암호화)
  STATE_KEY: ${{ secrets.STATE_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    # 과거 기사 채우기는 75분 (스크립트가 45분 안에 스스로 멈춤 → 평소 수집이 오래 기다리지 않게), 평소 수집은 45분
    timeout-minutes: ${{ (inputs.mode == 'backfill' || github.event.schedule == '50 */3 * * *') && 75 || 45 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci

      # 지난 실행의 암호화 상태 (Supabase와 버전이 같으면 내려받지 않아 무료 다운로드 한도를 아낀다)
      - name: 상태 캐시 꺼내기
        uses: actions/cache/restore@v4
        with:
          path: .state-cache
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 수집 데이터 내려받기
        id: pull
        run: npm run sync -- pull

      - name: 브라우저 캐시
        if: env.MODE == 'full' || env.MODE == 'fast' || env.MODE == 'backfill'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: 브라우저 설치
        if: env.MODE == 'full' || env.MODE == 'fast' || env.MODE == 'backfill'
        run: npx playwright install --with-deps chromium

      - name: 수집
        id: collect
        if: env.MODE == 'full' || env.MODE == 'fast' || env.MODE == 'backfill'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_REPORTS_ID: 4225a7e3871048e8999155e3d16010e1
        run: |
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "backfill" ]; then
            # 과거 기사 채우기 (개발 비용은 운영 월 상한과 따로) → 다시 내보내기
            npm run backfill:news -- --minutes=20 --total-minutes=45 && npm run collect -- --publish-only
          elif [ "$MODE" = "fast" ]; then
            npm run collect -- --fast
          else
            npm run collect
          fi

      # 수집이 중간에 실패해도 이미 처리한 것(AI 결과 등)은 잃지 않게 올린다. 내려받기에 실패했으면 올리지 않는다
      - name: 수집 데이터 올리기
        id: push
        if: always() && steps.pull.outcome == 'success' && steps.collect.outcome != 'skipped'
        run: npm run sync -- push

      - name: 상태 캐시 저장
        if: always() && steps.push.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .state-cache
          key: state-${{ github.run_id }}

      # 사이트 데이터는 Supabase 공개 버킷으로, 질문 자료(원문 포함)는 KV로 → 배포 없이 사이트에 반영
      - name: 사이트 데이터 올리기
        if: steps.collect.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run publish:site

      # 질문 의미 검색 색인 (바뀐 조각만 임베딩, 보통 몇 원 이하)
      - name: RAG 색인
        if: steps.collect.outcome == 'success' && steps.collect.outputs.mode != 'fast'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run rag:index

      # 사이트 배포는 코드가 바뀌었을 때만 (main 푸시·직접 실행)
      - name: 사이트 빌드
        if: env.MODE == 'site'
        working-directory: site
        run: npm ci && npm run build

      - name: Cloudflare Pages 배포
        if: env.MODE == 'site'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT || 'dream-archive' }}" --branch main --commit-dirty=true
