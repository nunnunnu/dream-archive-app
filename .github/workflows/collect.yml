name: collect

on:
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Public board category URL to request once'
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      LIST_URL: ${{ inputs.list_url }}
      SITE_DATA_URL: https://ejexnrkwktkukpilkbaf.supabase.co/storage/v1/object/public/site-data
    steps:
      - name: Check one listing page
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';

          const note = (line) => {
            console.log(line);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n\n');
          };
          const source = new URL(process.env.LIST_URL);
          if (source.protocol !== 'https:' || source.username || source.password) throw Error('Use a public HTTPS URL.');
          const response = await fetch(source, {
            headers: { 'User-Agent': 'dream-archive/0.1 (personal fan archive)', 'Accept-Language': 'ko' },
            redirect: 'manual',
            signal: AbortSignal.timeout(15000),
          });
          note(`첫 페이지 HTTP ${response.status} (요청 1회)`);
          if (!response.ok) {
            note('목록 조회를 종료했습니다.');
            process.exit(0);
          }

          const normalize = (value) => value.normalize('NFKC')
            .replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#(?:39|039);/g, "'")
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ')
            .replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}]/gu, '').toLowerCase();
          const board = source.pathname.split('/').filter(Boolean)[0];
          const html = await response.text();
          const listed = new Map();
          for (const row of html.matchAll(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)) {
            if (/class=["'][^"']*\bnotice\b/i.test(row[0])) continue;
            const match = row[0].match(/<td\b[^>]*class=["'][^"']*\btitle\b[^"']*["'][^>]*>\s*<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/i);
            if (!match) continue;
            const link = new URL(match[1], source);
            const [pathBoard, id] = link.pathname.split('/').filter(Boolean);
            if (link.origin === source.origin && pathBoard === board && /^\d+$/.test(id)) listed.set(id, normalize(match[2]));
          }
          note(`목록에서 읽은 게시물 ${listed.size}건`);
          if (!listed.size) throw Error('HTTP 응답은 성공했으나 게시물 목록을 확인할 수 없습니다.');

          async function json(path) {
            const response = await fetch(`${process.env.SITE_DATA_URL}/${path}`, { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw Error(`Dreamlog 데이터 HTTP ${response.status}`);
            return response.json();
          }
          const manifest = await json('manifest.json');
          const { items } = await json(manifest.files['feed.json']);
          const recent = new Set(items.filter((item) => Date.parse(item.publishedAt) >= Date.now() - 7 * 864e5)
            .map((item) => normalize(item.title)));
          const matched = [...listed.values()].filter((title) => title.length >= 10 && recent.has(title)).length;
          note(`최근 공개 소식과 제목 일치 ${matched}건 · 원문 확인 필요 ${listed.size - matched}건`);
          JS
