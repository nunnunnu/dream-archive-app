# Cloudflare Pages 설정. 비밀값(GROQ_API_KEY·OPENAI_API_KEY)은 여기 말고 Pages secret 으로.
name = "dream-archive"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 제보·질문 횟수 제한·답변 평가(👍/👎) 저장
[[kv_namespaces]]
binding = "REPORTS"
id = "4225a7e3871048e8999155e3d16010e1"

[vars]
# 질문 의미 검색(pgvector)용. 비밀 키는 pages secret SUPABASE_SERVICE_ROLE_KEY
SUPABASE_URL = "https://ejexnrkwktkukpilkbaf.supabase.co"
# 사이트 데이터 (수집기가 npm run publish:site 로 올림). 공개 주소라 비밀값 아님
SITE_DATA_URL = "https://ejexnrkwktkukpilkbaf.supabase.co/storage/v1/object/public/site-data"
GROQ_MODEL = "qwen/qwen3.8-27b"
GROQ_SMALL_MODEL = "openai/gpt-oss-20b"
GROQ_RERANK_MODEL = "openai/gpt-oss-120b"
OPENAI_FALLBACK_MODEL = "gpt-5-mini"
ASK_DAILY_LIMIT = "50"
# 어드민 로그인(Cloudflare Access). 비밀값 아님. 비어 있으면 /admin 은 아무도 못 들어온다
# ACCESS_TEAM_DOMAIN: Zero Trust 팀 도메인 (예: 팀이름.cloudflareaccess.com), ACCESS_AUD: Access 앱의 Application Audience (AUD) 태그
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
