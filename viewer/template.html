<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCT DREAM 아카이브 미리보기</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ec; --text: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
    --accent: #3a7d44; --today: #fff4cc;
    --k-신청: #2563eb; --k-당첨발표: #7c3aed; --k-본인확인: #0891b2; --k-녹화: #db2777; --k-방송: #e11d48;
    --k-투표: #ea580c; --k-판매: #16a34a; --k-발매: #c026d3; --k-행사: #b7791f; --k-모임: #0d9488; --k-기타: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --text: #ececE8; --muted: #9a9a93; --line: #33332f;
      --accent: #7cc58a; --today: #3a3420;
      --k-신청: #6ea0ff; --k-당첨발표: #a98bff; --k-본인확인: #4fc3d9; --k-녹화: #f472b6; --k-방송: #fb7185;
      --k-투표: #fb923c; --k-판매: #4ade80; --k-발매: #e879f9; --k-행사: #e3b341; --k-모임: #2dd4bf; --k-기타: #a1a1aa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { padding: 20px 16px 0; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .stats { color: var(--muted); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; }
  nav.tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  nav.tabs button { background: none; border: 0; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar h2 { font-size: 18px; margin: 0 8px; min-width: 120px; text-align: center; }
  .btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--text); }
  .chip[aria-pressed="false"] { opacity: .4; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal .wd { font-size: 12px; color: var(--muted); padding: 8px; text-align: center; border-bottom: 1px solid var(--line); }
  .cal .wd:first-child { color: #d9534f; }
  .day { min-height: 104px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; cursor: pointer; text-align: left; background: none; border-top: 0; border-left: 0; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .day:nth-child(7n+7) { border-right: 0; }
  .day.other { opacity: .35; }
  .day.today { background: var(--today); }
  .day.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day .n { font-size: 12px; color: var(--muted); }
  .day .ev { font-size: 11px; line-height: 1.35; padding: 1px 4px; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .more { font-size: 11px; color: var(--muted); }
  /* 여러 날 이어지는 일정: 칸을 이어 붙인 막대처럼 */
  .day .ev.span { border-radius: 0; margin-left: -9px; margin-right: -9px; padding-left: 12px; }
  .day .ev.span.first { border-radius: 3px 0 0 3px; margin-left: 0; padding-left: 4px; }
  .day .ev.span.last { border-radius: 0 3px 3px 0; margin-right: 0; }
  .day .ev.span.first.last { border-radius: 3px; }
  .day .ev.span.mid { border-left-color: transparent; color: color-mix(in srgb, var(--c) 70%, var(--text, #333)); }
  .day .ev.gap { background: transparent; border-color: transparent; }
  .cal-switch { display: flex; gap: 0; margin-bottom: 12px; }
  .cal-switch button { padding: 8px 18px; border: 1px solid var(--line, #ddd); background: transparent; font-size: 14px; cursor: pointer; }
  .cal-switch button:first-child { border-radius: 8px 0 0 8px; } .cal-switch button:last-child { border-radius: 0 8px 8px 0; }
  .cal-switch button[aria-pressed="true"] { background: var(--text, #222); color: var(--bg, #fff); font-weight: 600; }
  @media (max-width: 600px) { .day { min-height: 56px; } .day .ev { font-size: 0; padding: 0; height: 6px; border-left-width: 6px; } .day .more { font-size: 10px; } }
  .panel { padding: 12px 14px; }
  .panel h3 { font-size: 15px; margin: 0 0 8px; }
  .date-group { margin-top: 14px; }
  .date-group > .d { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .t { font-variant-numeric: tabular-nums; font-size: 13px; }
  .row .t small { display: block; color: var(--muted); font-size: 11px; }
  .row .label { font-weight: 600; }
  .kind { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 999px; padding: 0 7px; margin-right: 6px; vertical-align: 1px; }
  .badge { font-size: 11px; border-radius: 4px; padding: 0 5px; margin-left: 4px; background: var(--surface-2); color: var(--muted); }
  .badge.warn { background: color-mix(in srgb, #ea580c 18%, transparent); color: #c2410c; }
  .badge.ai { background: color-mix(in srgb, #2563eb 16%, transparent); color: #2563eb; }
  .src { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .who { font-size: 11px; border-radius: 999px; padding: 0 7px; margin-left: 6px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); white-space: nowrap; }
  .who.group { background: var(--surface-2); color: var(--muted); }
  .ctx { font-size: 12px; color: var(--muted); font-weight: 600; }
  .src a { margin-right: 8px; }
  .line { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); padding: 12px 0; }
  .tbd { margin-top: 16px; }
  .tbd .item { padding: 8px 0; border-top: 1px solid var(--line); }
  input[type="search"] { width: 100%; max-width: 420px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; }
  .notice { border-top: 1px solid var(--line); }
  .notice:first-child { border-top: 0; }
  .notice > button { width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; font: inherit; color: inherit; cursor: pointer; display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
  .notice > button:hover { background: var(--surface-2); }
  .notice .date { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .notice .count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .notice .open { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 0 14px 14px; }
  @media (max-width: 800px) { .notice .open { grid-template-columns: 1fr; } .notice > button { grid-template-columns: 1fr; gap: 2px; } }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: var(--surface-2); border-radius: 8px; padding: 12px; max-height: 520px; overflow: auto; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .topic { padding: 14px; }
  .topic .kw { font-size: 18px; font-weight: 700; }
  .topic ul { padding-left: 18px; margin: 8px 0 0; }
  .topic li { margin: 4px 0; font-size: 13px; }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
</style>
</head>
<body>
<header>
  <h1>NCT DREAM 아카이브 미리보기</h1>
  <div class="stats" id="stats"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<script>
const DATA = /*__DATA__*/null;

const KINDS = ['신청', '당첨 발표', '본인 확인', '녹화', '방송', '발매', '투표', '판매', '행사', '모임', '기타'];
const WHO_FILTERS = ['전체', '단체', '런쥔', '제노', '해찬', '재민', '천러', '지성'];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const kindColor = (k) => `var(--k-${k.replace(/\s/g, '')})`;
const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
const [ty, tm] = todayStr.split('-').map(Number);

const state = { tag: null, tab: 'events', y: ty, m: tm, selected: null, kinds: new Set(KINDS), who: '전체', by: '전체', cat: '공식', hideWinners: true, q: '', openNotice: null };
const BY_LABEL = { ai: 'AI', rule: '규칙', news: '기사' };
const byMatch = (e) => state.by === '전체' || BY_LABEL[e.extractedBy] === state.by;
const whoMatch = (who) => state.who === '전체' || (state.who === '단체' ? who.scope === '단체' : who.members.includes(state.who));
const whoBadge = (who) => h('span', { class: who.scope === '단체' ? 'who group' : 'who' }, who.label);
/** 일정 이름에 대상이 이미 들어 있으면 이름만, 아니면 "대상 · 이름" */
const PERIOD_KINDS = ['투표', '판매', '신청'];
const fullLabel = (e) => (e.label.includes(e.context) || e.context.includes(e.label) ? e.label : `${e.context} · ${e.label}`);
/** 달력 칸용: 대상 앞의 그룹명("NCT DREAM", "2026")을 떼고 짧게 */
const ctxShort = (c) => c.replace(/^NCT\s*DREAM[:\s]*/i, '').replace(/^(KBS|MBC|SBS)\s+/, '');
const shortLabel = (e) => {
  if (e.label.includes(e.context) || e.context.includes(e.label)) return e.label;
  const c = ctxShort(e.context);
  return `${c.length > 10 ? c.slice(0, 10) + '…' : c} · ${e.label}`;
};

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}

const fmtDate = (d) => { const [y, m, dd] = d.split('-').map(Number); const wd = WEEKDAYS[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]; return `${m}/${dd} (${wd})`; };
const fmtKst = (iso) => new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
const fmtDay = (iso) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date(iso));

const noticeById = new Map(DATA.notices.map((n) => [n.id, n]));
const eventsOfNotice = (id) => DATA.events.filter((e) => e.source.id === id || (e.otherSources || []).some((s) => s.id === id));

function visibleEvents() {
  return DATA.events.filter((e) => state.kinds.has(e.kind) && whoMatch(e.who) && byMatch(e)
    && (state.cat === '전체' || (e.calendars || [e.category]).includes(state.cat)) && !(state.hideWinners && e.audience === 'winners' && !(state.cat === '공식' && e.kind === '녹화')));
}

function eventTime(e) {
  let t = e.time || '시간 미정';
  if (e.endTime && !e.endDate) t += `~${e.endTime}`;
  return t;
}

function eventRow(e, { showDate = false } = {}) {
  const sources = [e.source, ...(e.otherSources || [])];
  return h('div', { class: 'row' },
    h('div', { class: 't' }, showDate ? fmtDate(e.date) : null, showDate ? h('small', {}, eventTime(e)) : eventTime(e),
      e.timezone ? h('small', {}, `현지 시간 ${e.timezone}`) : null),
    h('div', {},
      e.label.includes(e.context) || e.context.includes(e.label) ? null : h('div', { class: 'ctx' }, e.context),
      h('span', { class: 'kind', style: `--c:${kindColor(e.kind)}` }, h('span', { class: 'dot' }), e.kind),
      h('span', { class: 'label' }, e.label),
      whoBadge(e.who),
      h('span', { class: e.extractedBy === 'ai' ? 'badge ai' : 'badge' }, BY_LABEL[e.extractedBy] || ''),
      h('span', { class: 'badge' }, e.category),
      e.audience === 'winners' ? h('span', { class: 'badge warn' }, '당첨자용') : null,
      /유튜브|youtube/i.test(e.context) && !sources.some((s) => s.type === 'youtube') ? h('span', { class: 'badge' }, e.date >= todayStr ? '▶ 공개 전' : '▶ 영상 링크 찾는 중') : null,
      e.endDate && e.endDate !== e.date ? h('span', { class: 'badge' }, `기간 ${fmtDate(e.date)}${e.phase === 'end' ? '' : e.time ? ' ' + e.time : ''} ~ ${fmtDate(e.endDate)}${e.phase === 'end' ? (e.time ? ' ' + e.time : '') : e.endTime ? ' ' + e.endTime : ''}`) : null,
      PERIOD_KINDS.includes(e.kind) && !e.endDate && /(시작|오픈)$/.test(e.label) ? h('span', { class: 'badge warn' }, '마감 미정') : null,
      e.uncertain ? h('span', { class: 'badge warn' }, e.extractedBy === 'ai' ? '확인 필요' : '요일 확인 필요') : null,
      h('div', { class: 'line' }, e.detail),
      h('div', { class: 'src' }, sources.map((s) => h(s.url ? 'a' : 'span', s.url ? { href: s.url, target: '_blank', rel: 'noopener', title: s.title } : { title: '원래 게시물 링크 없음' },
        s.type === 'youtube' ? `▶ ${s.publisher || '유튜브'} 영상 ↗` : s.type === 'news' ? `${s.publisher || '기사'} ↗` : s.type === 'submission' ? '제보 글 ↗' : s.type === 'sns' ? `${s.publisher || 'SNS'} ↗` : `공지 ${s.id} ↗`))),
    ),
  );
}

function renderStats() {
  const ids = DATA.notices.map((n) => n.postedAt).sort();
  const el = document.getElementById('stats');
  el.replaceChildren(
    h('span', {}, '위버스 공지 ', h('b', {}, DATA.notices.length), `개 (${ids[0]?.slice(0, 7)} ~)`),
    h('span', {}, '일정 ', h('b', {}, DATA.events.length), '개'),
    h('span', {}, '날짜 미정 ', h('b', {}, (DATA.pending || []).length), '개'),
    h('span', {}, `데이터 생성 ${fmtKst(DATA.builtAt)}`),
  );
}

function renderTabs() {
  const tabs = [['events', '일정'], ['collect', '모아보기'], ['notices', '공지'], ['feed', '소식']];
  document.getElementById('tabs').replaceChildren(...tabs.map(([id, label]) =>
    h('button', { role: 'tab', 'aria-selected': String(state.tab === id), onclick: () => { state.tab = id; render(); } }, label)));
}

function renderEvents() {
  const { y, m } = state;
  const evs = visibleEvents();
  const byDate = new Map();
  const put = (d, e) => (byDate.get(d) || byDate.set(d, []).get(d)).push(e);
  for (const e of evs) {
    if (e.endDate && e.endDate !== e.date) {
      // 여러 날 이어지는 일정은 기간 안의 모든 날에 막대로 (투표·예매·신청은 첫날 "시작", 마지막 날 "마감")
      const period = PERIOD_KINDS.includes(e.kind);
      const d = new Date(`${e.date}T00:00:00Z`);
      for (let i = 0; i < 92; i++) {
        const ds = d.toISOString().slice(0, 10);
        const first = ds === e.date, last = ds === e.endDate;
        put(ds, { ...e, span: true, first, last, time: first ? e.time : last && period ? e.endTime : undefined,
          label: first ? (period ? `${e.label} 시작` : e.label) : last && period ? `${e.label} 마감` : e.label });
        if (last) break;
        d.setUTCDate(d.getUTCDate() + 1);
      }
    } else put(e.date, e);
  }
  for (const list of byDate.values()) list.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));

  const shift = (d) => { let nm = m + d, ny = y; if (nm < 1) { nm = 12; ny--; } if (nm > 12) { nm = 1; ny++; } state.y = ny; state.m = nm; state.selected = null; render(); };
  const toolbar = h('div', { class: 'toolbar' },
    h('button', { class: 'btn', onclick: () => shift(-1), 'aria-label': '이전 달' }, '◀'),
    h('h2', {}, `${y}년 ${m}월`),
    h('button', { class: 'btn', onclick: () => shift(1), 'aria-label': '다음 달' }, '▶'),
    h('button', { class: 'btn', onclick: () => { state.y = ty; state.m = tm; state.selected = todayStr; render(); } }, '오늘'),
  );
  const counts = new Map(KINDS.map((k) => [k, 0]));
  for (const e of DATA.events) counts.set(e.kind, (counts.get(e.kind) || 0) + 1);
  const chips = h('div', { class: 'chips', style: 'margin-bottom:12px' }, KINDS.map((k) =>
    h('button', { class: 'chip', 'aria-pressed': String(state.kinds.has(k)), style: `--c:${kindColor(k)}`,
      onclick: () => { state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k); render(); } },
      h('span', { class: 'dot' }), `${k} ${counts.get(k)}`)));

  // 달력
  const first = new Date(Date.UTC(y, m - 1, 1));
  const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
  // 주마다 기간 막대의 줄(lane)을 정해서, 같은 일정이 매일 같은 높이에 이어지게 한다
  const dayStr = (i) => { const d = new Date(start); d.setUTCDate(start.getUTCDate() + i); return d.toISOString().slice(0, 10); };
  const laid = new Map();
  for (let w = 0; w < 6; w++) {
    const days = Array.from({ length: 7 }, (_, k) => dayStr(w * 7 + k));
    const spans = new Map();
    days.forEach((ds, k) => (byDate.get(ds) || []).filter((e) => e.span).forEach((e) => {
      const r = spans.get(e.id) || { e, from: k, to: k }; r.to = k; spans.set(e.id, r);
    }));
    const lanes = [];
    const laneOf = new Map();
    [...spans.values()].sort((a, b) => a.from - b.from || (b.to - b.from) - (a.to - a.from)).forEach((r) => {
      let lane = 0;
      while ((lanes[lane] || []).some((x) => !(r.to < x.from || r.from > x.to))) lane++;
      (lanes[lane] = lanes[lane] || []).push(r);
      laneOf.set(r.e.id, lane);
    });
    days.forEach((ds) => {
      const list = byDate.get(ds) || [];
      const row = [];
      list.filter((e) => e.span).forEach((e) => { row[laneOf.get(e.id)] = e; });
      for (let k = 0; k < row.length; k++) if (!row[k]) row[k] = { gap: true };
      laid.set(ds, [...row, ...list.filter((e) => !e.span)]);
    });
  }
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setUTCDate(start.getUTCDate() + i);
    const ds = d.toISOString().slice(0, 10);
    if (i >= 35 && d.getUTCMonth() !== m - 1) break;
    const list = (laid.get(ds) || []);
    const real = list.filter((e) => !e.gap);
    const cls = ['day', d.getUTCMonth() !== m - 1 && 'other', ds === todayStr && 'today', ds === state.selected && 'selected'].filter(Boolean).join(' ');
    cells.push(h('button', { class: cls, onclick: () => { state.selected = state.selected === ds ? null : ds; render(); }, 'aria-label': `${ds} 일정 ${real.length}개` },
      h('span', { class: 'n' }, d.getUTCDate()),
      list.slice(0, 3).map((e) => e.gap ? h('div', { class: 'ev gap', 'aria-hidden': 'true' }, '\u00a0') : h('div', { class: ['ev', e.span && 'span', e.first && 'first', e.last && 'last', e.span && !e.first && !e.last && 'mid'].filter(Boolean).join(' '),
        style: `--c:${kindColor(e.kind)}`, title: `${eventTime(e)} ${fullLabel(e)} (${e.who.label})` },
        e.span && !e.first && !e.last && d.getUTCDay() !== 0 ? '\u00a0' : `${e.time ? e.time + ' ' : ''}${shortLabel(e)}`)),
      real.length > list.slice(0, 3).filter((e) => !e.gap).length ? h('span', { class: 'more' }, `+${real.length - list.slice(0, 3).filter((e) => !e.gap).length}개`) : null,
    ));
  }
  const cal = h('div', { class: 'card cal' }, WEEKDAYS.map((w) => h('div', { class: 'wd' }, w)), cells);

  // 오른쪽: 선택한 날 또는 이 달 전체
  const monthPrefix = `${y}-${String(m).padStart(2, '0')}`;
  let panel;
  if (state.selected) {
    const list = byDate.get(state.selected) || [];
    const ongoing = [];
    panel = h('div', { class: 'card panel' }, h('h3', {}, `${fmtDate(state.selected)} 일정 ${list.length}개`),
      list.length ? list.map((e) => eventRow(e)) : h('div', { class: 'empty' }, '일정이 없어요.'),
      ongoing.length ? [h('h3', { style: 'margin-top:16px' }, `진행 중 ${ongoing.length}개`), ongoing.map((e) => eventRow(e))] : null);
  } else {
    const dates = [...byDate.keys()].filter((d) => d.startsWith(monthPrefix)).sort();
    panel = h('div', { class: 'card panel' }, h('h3', {}, `${m}월 일정 ${dates.reduce((n, d) => n + byDate.get(d).length, 0)}개`),
      dates.length ? dates.map((d) => h('div', { class: 'date-group' }, h('div', { class: 'd' }, fmtDate(d)), byDate.get(d).map((e) => eventRow(e))))
        : h('div', { class: 'empty' }, '이 달에는 뽑힌 일정이 없어요.'));
  }

  // 날짜 미정 소식
  const pendingList = (DATA.pending || []).filter((a) => whoMatch(a.who));
  const tbd = h('div', { class: 'card panel tbd' }, h('h3', {}, '날짜 미정 소식'),
    h('p', { class: 'note' }, '확정 소식이지만 정확한 날짜가 아직 없어요. 날짜가 나오면 일정으로 들어가요.'),
    pendingList.length ? pendingList.map((a) => h('div', { class: 'item' },
      h('span', { class: 'badge' }, a.whenText || '날짜 미정'), ' ', h('b', {}, a.title), ` · ${a.step}`, whoBadge(a.who),
      h('div', { class: 'src' }, a.sources.slice(0, 3).map((s) => h('a', { href: s.url, target: '_blank', rel: 'noopener' }, `${s.publisher || s.title.slice(0, 20)} ↗`)))))
      : h('div', { class: 'empty' }, '없어요.'));

  const whoChips = h('div', { class: 'chips', style: 'margin-bottom:8px' }, WHO_FILTERS.map((w) =>
    h('button', { class: 'chip', 'aria-pressed': String(state.who === w), onclick: () => { state.who = w; render(); } }, w)));
  const calSwitch = h('div', { class: 'cal-switch', role: 'group', 'aria-label': '캘린더 선택' },
    [['공식', '공식 일정 · 드림이 나오는 일정'], ['참여', '참여 일정 · 예약·티켓팅·인증·신청'], ['전체', '전체']].map(([c, label]) =>
      h('button', { 'aria-pressed': String(state.cat === c), onclick: () => { state.cat = c; render(); } }, label)));
  const catChips = h('div', { class: 'chips', style: 'margin-bottom:8px' },
    h('button', { class: 'chip', 'aria-pressed': String(state.hideWinners), onclick: () => { state.hideWinners = !state.hideWinners; render(); } }, '당첨자용 단계 숨기기'));
  const byChips = h('div', { class: 'chips', style: 'margin-bottom:8px' }, ['전체', 'AI', '규칙', '기사'].map((b) =>
    h('button', { class: 'chip', 'aria-pressed': String(state.by === b), onclick: () => { state.by = b; render(); } }, b === '전체' ? '추출 방식: 전체' : b)));
  const rumorList = (DATA.rumors || []).filter((r) => state.who === '전체' || r.guessMembers.includes(state.who));
  const rumorBox = h('div', { class: 'card panel tbd' }, h('h3', {}, '추측·예고'),
    h('p', { class: 'note' }, '멤버가 아직 확인되지 않은 예고예요. 캘린더에는 넣지 않고, 확인되면 일정으로 옮겨져요.'),
    rumorList.length ? rumorList.map((r) => h('div', { class: 'item' },
      h('span', { class: 'badge' }, `${fmtDate(r.date)}${r.time ? ' ' + r.time : ''}`), ' ', h('b', {}, r.title), ` · ${r.step}`,
      r.guessMembers.length ? h('span', { class: 'badge warn' }, `${r.guessMembers.join('·')} 추측`) : null,
      h('div', { class: 'line' }, r.evidence),
      h('div', { class: 'src' }, r.sources.slice(0, 3).map((s) => h('a', { href: s.url, target: '_blank', rel: 'noopener' }, s.type === 'submission' ? '제보 글 ↗' : `${s.publisher || '출처'} ↗`)))))
      : h('div', { class: 'empty' }, '없어요.'));
  const reviewList = (DATA.review || []).filter((r) => whoMatch(r.who));
  const reviewBox = h('div', { class: 'card panel tbd' }, h('h3', {}, `확인 대기 ${reviewList.length}개`),
    h('p', { class: 'note' }, '출처가 하나뿐인 일정이에요. 캘린더에는 넣지 않고, 다른 언론사·영상이 하나 더 확인되면 일정으로 옮겨져요.'),
    reviewList.length ? reviewList.map((r) => h('div', { class: 'item' },
      h('span', { class: 'badge' }, `${fmtDate(r.date)}${r.time ? ' ' + r.time : ''}`), ' ', h('b', {}, r.title), ` · ${r.step}`, whoBadge(r.who),
      h('span', { class: 'badge warn' }, r.reason),
      h('div', { class: 'line' }, r.evidence),
      h('div', { class: 'src' }, r.sources.slice(0, 3).map((s) => h('a', { href: s.url, target: '_blank', rel: 'noopener' }, s.type === 'youtube' ? `▶ ${s.publisher || '유튜브'} ↗` : `${s.publisher || '기사'} ↗`)))))
      : h('div', { class: 'empty' }, '없어요.'));
  return [calSwitch, toolbar, whoChips, state.cat === '공식' ? null : catChips, byChips, chips, h('div', { class: 'layout' }, h('div', {}, cal, reviewBox, rumorBox, tbd), panel)].filter(Boolean);
}

function renderNotices() {
  const q = state.q.trim().toLowerCase();
  const list = [...DATA.notices].sort((a, b) => b.postedAt.localeCompare(a.postedAt))
    .filter((n) => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));
  const search = h('input', { type: 'search', placeholder: '공지 제목·본문 검색 (예: 사전녹화, 팬미팅)', value: state.q,
    oninput: (ev) => { state.q = ev.target.value; const pos = ev.target.selectionStart; render(); const el = document.querySelector('input[type="search"]'); el.focus(); el.setSelectionRange(pos, pos); } });
  return [
    h('div', { class: 'toolbar' }, search, h('span', { class: 'note', style: 'margin:0' }, `${list.length}개`)),
    h('p', { class: 'note' }, '공지를 누르면 본문과 거기서 뽑힌 일정을 나란히 보여줘요. 파서가 맞게 뽑았는지 확인하는 용도예요.'),
    h('div', { class: 'card' }, list.map((n) => {
      const evs = eventsOfNotice(n.id);
      const open = state.openNotice === n.id;
      return h('div', { class: 'notice' },
        h('button', { 'aria-expanded': String(open), onclick: () => { state.openNotice = open ? null : n.id; render(); } },
          h('span', { class: 'date' }, fmtKst(n.postedAt).slice(0, 12)),
          h('span', {}, n.title, whoBadge(n.who)),
          h('span', { class: 'count' }, evs.length ? `일정 ${evs.length}개` : '일정 없음')),
        open ? h('div', { class: 'open' },
          h('div', {}, h('div', { class: 'src', style: 'margin-bottom:6px' }, h('a', { href: n.url, target: '_blank', rel: 'noopener' }, '위버스 원문 ↗')), h('div', { class: 'body' }, n.body)),
          h('div', {}, h('h3', { style: 'font-size:14px;margin:0 0 6px' }, `뽑힌 일정 ${evs.length}개`),
            evs.length ? [...evs].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).map((e) => eventRow(e, { showDate: true }))
              : h('div', { class: 'empty' }, '이 공지에서는 일정을 찾지 못했어요.'))) : null);
    })),
  ];
}

function renderFeed() {
  const TYPE = { 'weverse-notice': '위버스 공지', news: '기사', youtube: '영상', sns: 'SNS' };
  const list = (DATA.feed || []).filter((f) => state.who === '전체' || (state.who === '단체' ? !f.members.length : f.members.includes(state.who)));
  return [
    h('p', { class: 'note' }, '소식 아카이브 (위버스 공지 전체, 같은 소식 기사는 묶어서, 영상 1년)'),
    h('div', { class: 'card' }, list.slice(0, 300).map((f) => h('div', { class: 'row', style: 'padding:10px 14px' },
      h('div', { class: 't' }, fmtDate(fmtDay(f.publishedAt)), h('small', {}, TYPE[f.type])),
      h('div', {}, h('a', { href: f.url, target: '_blank', rel: 'noopener' }, f.type === 'youtube' ? `▶ ${f.title}` : f.title),
        f.members.length ? whoBadge({ scope: '멤버', members: f.members, label: f.members.join('·') }) : null,
        h('div', { class: 'src' }, `${f.publisher || ''}${f.count > 1 ? ` · 같은 소식 기사 ${f.count}개` : ''}`))))),
  ];
}

const KIND_NAME = { era: '활동기', project: '작품·시리즈·행사', type: '종류', member: '멤버', year: '연도' };
function renderCollect() {
  const groups = {};
  for (const t of DATA.tags || []) (groups[t.kind] = groups[t.kind] || []).push(t);
  if (!state.tag && (DATA.tags || []).length) state.tag = DATA.tags[0].id;
  const picker = h('div', { class: 'card panel' }, Object.keys(KIND_NAME).filter((k) => groups[k]).map((k) =>
    h('div', { style: 'margin-bottom:10px' }, h('div', { class: 'note', style: 'margin:0 0 6px' }, KIND_NAME[k]),
      h('div', { class: 'chips' }, groups[k].slice(0, k === 'project' ? 40 : 20).map((t) =>
        h('button', { class: 'chip', 'aria-pressed': String(state.tag === t.id), onclick: () => { state.tag = t.id; render(); } }, `${t.name} ${t.count}`))))));
  const tag = (DATA.tags || []).find((t) => t.id === state.tag);
  const evs = DATA.events.filter((e) => (e.tags || []).includes(state.tag) && !(state.hideWinners && e.audience === 'winners'))
    .sort((a, b) => `${b.date} ${b.time || ''}`.localeCompare(`${a.date} ${a.time || ''}`));
  const TYPE = { 'weverse-notice': '위버스 공지', news: '기사', youtube: '영상', sns: 'SNS' };
  const feed = (DATA.feed || []).filter((f) => (f.tags || []).includes(state.tag));
  return [picker, h('div', { class: 'layout' },
    h('div', { class: 'card panel' }, h('h3', {}, `${tag ? tag.name : ''} · 일정 ${evs.length}개`),
      evs.length ? evs.map((e) => eventRow(e, { showDate: true })) : h('div', { class: 'empty' }, '일정이 없어요.')),
    h('div', { class: 'card panel' }, h('h3', {}, `소식 ${feed.length}개`),
      feed.length ? feed.slice(0, 200).map((f) => h('div', { class: 'item' },
        h('span', { class: 'badge' }, `${fmtDate(fmtDay(f.publishedAt))} ${TYPE[f.type]}`), ' ',
        h('a', { href: f.url, target: '_blank', rel: 'noopener' }, f.type === 'youtube' ? `▶ ${f.title}` : f.title),
        h('div', { class: 'src' }, f.publisher || ''))) : h('div', { class: 'empty' }, '소식이 없어요.')))];
}

function render() {
  renderTabs();
  const main = document.getElementById('main');
  const view = state.tab === 'events' ? renderEvents() : state.tab === 'collect' ? renderCollect() : state.tab === 'notices' ? renderNotices() : renderFeed();
  main.replaceChildren(...view);
}

renderStats();
render();
</script>
</body>
</html>
